<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Sticky cosmic goo in raw WebGL2. Hover to stick, click to burst.">
<meta name="theme-color" content="#04050c">
<meta property="og:title" content="Cosmic Jam">
<meta property="og:description" content="Sticky cosmic goo in raw WebGL2. Hover to stick, click to burst.">
<title>Cosmic Jam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  /* Layout: one full-bleed WebGL stage. Type lives in hidden DOM, mirrored into a texture the goo refracts. A quiet HUD sits in the bottom corners. */
  :root {
    --void: #04050c;
    --ink: #dfe5ec;
    --muted: #7d89b4;
    --line: rgba(140, 160, 255, 0.24);
    --focus: #6f8cff;
    --font-display: "Anton", "Impact", "Arial Narrow", sans-serif;
    --font-ui: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--void); color: var(--ink); overflow: hidden; font-family: var(--font-ui); }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  .type { position: fixed; inset: 0; margin: 0; pointer-events: none; user-select: none; }
  .type h1, .type ul { margin: 0; padding: 0; list-style: none; font-size: inherit; }
  .type span, .type li {
    position: absolute; white-space: nowrap; line-height: 1; color: transparent;
    font-family: var(--font-display); font-weight: 400; text-transform: uppercase;
  }
  .nogl .type span, .nogl .type li { color: var(--ink); }

  .hud {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 2;
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 10px;
    padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    pointer-events: none;
    font: 500 11px/1.4 var(--font-ui); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
  }
  .hud > * { pointer-events: auto; }
  .hint { margin: 0; }
  .btns { display: flex; gap: 8px; }
  .hud button {
    font: inherit; letter-spacing: inherit; text-transform: inherit; color: var(--ink);
    background: rgba(8, 10, 26, 0.6); border: 1px solid var(--line); border-radius: 999px;
    padding: 7px 12px; cursor: pointer; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .hud button:hover { border-color: rgba(160, 180, 255, 0.55); }
  .hud button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .hud kbd { font: inherit; opacity: 0.55; margin-left: 6px; }
  .tp-dfwv { z-index: 3 !important; top: calc(12px + env(safe-area-inset-top, 0px)) !important; }
</style>
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}</style>
</head>
<body>
<canvas id="stage" aria-hidden="true"></canvas>

<header class="type" id="type">
  <h1><span id="l1">Content</span> <span id="l2">Universe</span></h1>
  <ul>
    <li id="t1">Sticky</li>
    <li id="t2">Vertical</li>
    <li id="t3">Media</li>
  </ul>
</header>

<div class="hud">
  <p class="hint" id="hint">Hover to stick, click to burst</p>
  <div class="btns">
    <button id="toggleType" type="button" aria-pressed="true">Hide type <kbd>T</kbd></button>
    <button id="toggleCtl" type="button" aria-pressed="false">Controls <kbd>P</kbd></button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tweakpane@3.1.10/dist/tweakpane.min.js"></script>
<script>
(() => {
'use strict';

/* ---------- parameters ---------- */
const P = {
  viscosity: 4.5, elasticity: 2.8, tension: 1.3, breathing: 2,
  reach: 0.05, follow: 90, slide: 1.2, thickness: 1, snap: 25,
  burstSize: 0.07, burstForce: 1.15,
  refraction: 3, rim: 1, seeThrough: 0.36, smear: 1,
  density: 0.95, brightness: 0.7, twinkle: 1, nebula: 1.45,
  showType: true, maxDpr: 1.5,
  cVoid: '#04050c', cBody: '#1b28c9', cDeep: '#080b45', cRim: '#a6ecff', cGlow: '#1a2c9a', cNeb: '#b97cff',
  cStar1: '#f4f1ff', cStar2: '#6fe4ff', cStar3: '#a98bff', cStar4: '#5470ff'
};
const FONT = '"Anton", "Impact", "Arial Narrow", sans-serif';
const $ = id => document.getElementById(id);
const textEls = { line1: $('l1'), line2: $('l2'), tag1: $('t1'), tag2: $('t2'), tag3: $('t3') };
const T = {};
for (const k in textEls) T[k] = textEls[k].textContent.trim();

const reduceMQ = matchMedia('(prefers-reduced-motion: reduce)');
let reduce = reduceMQ.matches;
reduceMQ.addEventListener && reduceMQ.addEventListener('change', e => { reduce = e.matches; });

const clamp = (v, a, b) => Math.min(Math.max(v, a), b);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const hex3 = h => { const n = parseInt(h.slice(1), 16); return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255]; };

/* ---------- GL setup ---------- */
const canvas = $('stage');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, depth: false, stencil: false, premultipliedAlpha: false, powerPreference: 'high-performance' });

const VS = `#version 300 es
in vec2 a; void main(){ gl_Position = vec4(a, 0.0, 1.0); }`;

const FS = `#version 300 es
precision highp float;
uniform vec2 uRes; uniform float uScale; uniform float uTime; uniform float uDrift;
uniform vec4 uEdge4[32]; uniform float uEdgeX0; uniform float uEdgeDX;
uniform vec4 uStrand[8]; uniform float uStrandOn;
uniform vec4 uDrops[16]; uniform int uDropN;
uniform vec4 uHoles[6]; uniform int uHoleN;
uniform vec4 uTrail[12]; uniform int uTrailN; uniform float uTrailR;
uniform sampler2D uScene; uniform float uTextAmt;
uniform vec2 uMouse; uniform vec2 uPar; uniform float uMouseOn;
uniform float uRw, uRefr, uSee, uDensity, uBright, uTwinkle, uNebula, uK;
uniform vec3 cVoid, cBody, cDeep, cRim, cGlow, cNeb, cS1, cS2, cS3, cS4;
out vec4 outColor;

float E(int i){ return uEdge4[i >> 2][i & 3]; }

float edgeH(float x, out float dh){
  float u = clamp((x - uEdgeX0) / uEdgeDX, 1.0, 125.999);
  int i = int(u); float t = u - float(i);
  float p0 = E(i - 1), p1 = E(i), p2 = E(i + 1), p3 = E(i + 2);
  float a = -0.5*p0 + 1.5*p1 - 1.5*p2 + 0.5*p3;
  float b = p0 - 2.5*p1 + 2.0*p2 - 0.5*p3;
  float c = -0.5*p0 + 0.5*p2;
  dh = (3.0*a*t*t + 2.0*b*t + c) / uEdgeDX;
  return ((a*t + b)*t + c)*t + p1;
}
float smin(float a, float b, float k){ float h = max(k - abs(a - b), 0.0) / k; return min(a, b) - h*h*k*0.25; }
float smax(float a, float b, float k){ return -smin(-a, -b, k); }

float sdUC(vec2 p, vec2 pa, vec2 pb, float ra, float rb){
  vec2 ba = pb - pa; float h = length(ba);
  if (h < 0.5) return length(p - pa) - max(ra, rb);
  vec2 dir = ba / h; vec2 q = p - pa;
  q = vec2(abs(dot(q, vec2(dir.y, -dir.x))), dot(q, dir));
  float b = (ra - rb) / h;
  if (abs(b) > 0.98) return min(length(p - pa) - ra, length(p - pb) - rb);
  float a = sqrt(1.0 - b*b);
  float k = dot(q, vec2(-b, a));
  if (k < 0.0) return length(q) - ra;
  if (k > a*h) return length(q - vec2(0.0, h)) - rb;
  return dot(q, vec2(a, b)) - ra;
}

float map(vec2 p){
  float dh; float h = edgeH(p.x, dh);
  float d = (p.y - h) / sqrt(1.0 + min(dh*dh, 9.0));
  if (uStrandOn > 0.5){
    float ds = 1e5;
    for (int i = 0; i < 7; i++) ds = smin(ds, sdUC(p, uStrand[i].xy, uStrand[i+1].xy, uStrand[i].z, uStrand[i+1].z), 6.0);
    d = smin(d, ds, uK);
  }
  for (int i = 0; i < 16; i++){ if (i >= uDropN) break; vec4 r = uDrops[i]; d = smin(d, length(p - r.xy) - r.z, uK*0.55); }
  for (int i = 0; i < 6; i++){ if (i >= uHoleN) break; vec4 r = uHoles[i]; d = smax(d, r.z - length(p - r.xy), uK*0.7); }
  return d;
}

float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
vec2 hash22(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973)); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.xx + p3.yz) * p3.zy); }
float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0 - 2.0*f);
  return mix(mix(hash12(i), hash12(i + vec2(1,0)), f.x), mix(hash12(i + vec2(0,1)), hash12(i + vec2(1,1)), f.x), f.y); }
float fbm(vec2 p){ float s = 0.0, a = 0.5; for (int i = 0; i < 4; i++){ s += a*vn(p); p = p*2.03 + vec2(17.1, 9.2); a *= 0.5; } return s; }

vec3 starLayer(vec2 q, float cell, float seed, float dens, float sizeK, float bright){
  vec2 g = q / cell; vec2 id = floor(g); vec2 f = fract(g);
  float e = hash12(id * 1.37 + seed * 11.0);
  if (e > dens) return vec3(0.0);
  vec2 h = hash22(id + seed * 17.0);
  vec2 pos = 0.2 + 0.6 * h;
  float dist = length(f - pos) * cell;
  float r = hash12(id + seed * 3.1);
  float size = (0.35 + 1.3 * r*r*r) * sizeK;
  float a = exp(-dist*dist / (size*size));
  float tw = mix(1.0, 0.4 + 0.6*sin(uTime*(0.8 + 2.6*h.x) + h.y*6.283), uTwinkle);
  float c = fract(e * 7.31 + h.x);
  vec3 col = c < 0.38 ? cS1 : c < 0.6 ? cS2 : c < 0.82 ? cS4 : cS3;
  return col * a * max(tw, 0.0) * mix(0.35, 1.7, r*r) * bright;
}

vec4 sceneAt(vec2 pp, float lod){
  return textureLod(uScene, vec2(pp.x / uRes.x, 1.0 - pp.y / uRes.y), lod) * uTextAmt;
}

void main(){
  vec2 p = vec2(gl_FragCoord.x, uRes.y * uScale - gl_FragCoord.y) / uScale;
  float minD = min(uRes.x, uRes.y);
  float rw = uRw;
  float t = uTime * uDrift;
  float d = map(p);

  /* the void */
  vec3 bg = cVoid + cGlow * 0.09 * (1.0 - smoothstep(0.0, uRes.y, p.y));
  vec4 sc = sceneAt(p, 0.0);
  vec3 outside = bg * (1.0 - sc.a) + sc.rgb;
  float dd = max(d, 0.0);
  outside *= 1.0 - 0.55 * exp(-dd / (rw * 1.4));
  outside += cGlow * 0.5 * exp(-dd / (rw * 4.0));
  vec3 col = outside;

  if (d < 1.5){
    float s = max(-d, 0.0);
    vec2 g = vec2(0.0, 1.0);
    if (s < rw * 1.5){
      vec2 e = vec2(1.0, 0.0);
      g = vec2(map(p + e.xy) - map(p - e.xy), map(p + e.yx) - map(p - e.yx));
      float gLen = length(g); g = gLen > 1e-5 ? g / gLen : vec2(0.0, 1.0);
    }
    float m = clamp(1.0 - s / rw, 0.0, 1.0);
    vec2 wob = vec2(fbm(p*0.0045 + vec2(t*0.04, 0.0)), fbm(p*0.0045 + vec2(5.2, -t*0.035))) - 0.5;
    vec3 n = normalize(vec3(g * m + wob * 0.35 * (1.0 - m), sqrt(max(1.0 - m*m, 0.0)) + 0.02));

    /* what's behind, bent through the goo */
    vec2 off = -n.xy * uRefr * rw * 1.8;
    float lod = mix(2.8, 0.3, m*m);
    vec4 sR = sceneAt(p + off, lod);
    float sG = sceneAt(p + off * 1.18, lod).g;
    float sB = sceneAt(p + off * 1.36, lod).b;
    vec3 refr = vec3(sR.r, sG, sB);
    float see = mix(uSee, 0.85, pow(m, 1.5));

    float depth = smoothstep(0.0, minD * 0.45, s);
    float nb = fbm(p*0.003 + vec2(t*0.012, -t*0.008));
    vec3 body = mix(cBody, cDeep, clamp(0.25 + depth*0.6 + (nb - 0.5)*0.9, 0.0, 1.0));
    vec3 ins = body * (1.0 - 0.55*m) * (1.0 - sR.a*see*0.5) + refr * vec3(0.62, 0.74, 1.0) * see;

    /* the space inside: smeared by the cursor, blown by bursts, lensed at the rim */
    vec2 q = p;
    for (int i = 0; i < 12; i++){ if (i >= uTrailN) break; vec4 tr = uTrail[i]; vec2 dv = p - tr.xy; q -= tr.zw * exp(-dot(dv, dv) / (uTrailR*uTrailR)); }
    for (int i = 0; i < 6; i++){ if (i >= uHoleN) break; vec4 hl = uHoles[i]; vec2 dv = p - hl.xy; float dl = length(dv) + 1e-3;
      q -= dv / dl * hl.z * 0.9 * exp(-max(dl - hl.z, 0.0) / (hl.z*0.6 + 1.0)); }
    q -= n.xy * rw * 1.4 * m;

    float boost = 1.0 + 1.9 * exp(-s / (rw * 3.0));
    vec2 drift = vec2(2.0, -1.1) * t;
    vec3 stars = starLayer(q + uPar*5.0  + drift*0.6, 3.3, 1.0, 0.55*uDensity*boost, 0.85, 0.55)
               + starLayer(q + uPar*12.0 + drift,     5.4, 2.0, 0.42*uDensity*boost, 1.05, 0.95)
               + starLayer(q + uPar*24.0 + drift*1.7, 9.5, 3.0, 0.30*uDensity*boost, 1.45, 1.35);

    float band = exp(-pow((q.x*0.55 + q.y - uRes.x*0.62) / (minD*0.22), 2.0));
    float neb = smoothstep(0.42, 0.82, fbm(q*0.0022 + vec2(t*0.01, t*0.006))) * mix(0.35, 1.0, band) * uNebula;
    ins += cNeb * neb * 0.32;
    stars *= 1.0 + neb * 1.4;
    stars = mix(stars, stars * (cNeb*0.6 + 0.6), neb*0.5);
    ins += stars * uBright * mix(1.0, 1.7, exp(-s / (rw*2.5)));
    ins += mix(cS2, cNeb, 0.35) * exp(-s / (rw*2.0)) * 0.2;

    /* glassy lip */
    vec3 L1 = normalize(vec3(-0.45, -0.75, 0.5));
    float sp1 = pow(max(dot(n, normalize(L1 + vec3(0.0, 0.0, 1.0))), 0.0), 60.0);
    vec2 toM = (uMouse - p) / (minD * 0.45);
    float sp2 = pow(max(dot(n, normalize(normalize(vec3(toM, 0.55)) + vec3(0.0, 0.0, 1.0))), 0.0), 36.0) * uMouseOn * exp(-dot(toM, toM)*0.6);
    float fres = pow(1.0 - n.z, 2.2);
    float ang = atan(g.y, g.x);
    vec3 irid = mix(vec3(0.12, 0.95, 0.72), vec3(0.25, 0.62, 1.0), 0.5 + 0.5*sin(ang*1.7 + s*0.25 + t*0.4));
    irid = mix(irid, cRim, 0.35);
    ins += irid * fres * 0.6;
    ins += cRim * (sp1*1.1 + sp2*0.9);
    ins *= 1.0 - 0.28 * exp(-pow((s - rw*0.62) / (rw*0.2), 2.0));
    ins += cRim * exp(-pow((s - 1.0) / 1.1, 2.0)) * 0.85;

    col = mix(outside, ins, smoothstep(0.9, -0.9, d));
  }

  vec2 vu = p / uRes - 0.5;
  col *= 1.0 - 0.3 * dot(vu, vu);
  col += (hash12(gl_FragCoord.xy + fract(uTime) * 91.0) - 0.5) / 170.0;
  outColor = vec4(col, 1.0);
}`;

function fail(msg) {
  document.documentElement.classList.add('nogl');
  $('hint').textContent = msg;
  console.error(msg);
}

let prog = null, U = {};
if (!gl) { fail('This needs WebGL2, which this browser has turned off'); }
else {
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(s)); return null; } return s; };
  const vs = sh(gl.VERTEX_SHADER, VS), fs = sh(gl.FRAGMENT_SHADER, FS);
  prog = gl.createProgram();
  if (vs && fs) { gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.bindAttribLocation(prog, 0, 'a'); gl.linkProgram(prog); }
  if (!vs || !fs || !gl.getProgramParameter(prog, gl.LINK_STATUS)) { console.error(gl.getProgramInfoLog(prog)); prog = null; fail('The shader failed to compile on this GPU'); }
}

/* ---------- state ---------- */
const N = 128, STEP = 1 / 120;
const edge = { h: new Float32Array(N), v: new Float32Array(N), rest: new Float32Array(N), x0: 0, dx: 1 };
let W = 1, H = 1, minD = 1, rScale = 1, quality = 1, time = 0, textAmt = 1;
const L = {};
const S = { on: false, attached: false, retract: false, rt: 0, ax: 0, L: 0, cooldown: 0,
  pts: Array.from({ length: 8 }, () => ({ x: 0, y: 0, px: 0, py: 0, r: 0 })), tip: { x: 0, y: 0, vx: 0, vy: 0 } };
const drops = [], holes = [], trail = [];
const ptr = { x: -1e4, y: -1e4, active: false, touching: false, vx: 0, vy: 0, lx: 0, ly: 0, downT: 0, downX: 0, downY: 0 };
const look = { mx: 0, my: 0, on: 0, px: 0, py: 0 };
let colors = {};

/* ---------- type: DOM is the source, drawn into a texture ---------- */
const scene = document.createElement('canvas');
const sctx = scene.getContext('2d');
let sceneTex = null;

function layoutType() {
  sctx.setTransform(1, 0, 0, 1, 0, 0);
  sctx.font = `100px ${FONT}`;
  sctx.textAlign = 'left'; sctx.textBaseline = 'alphabetic';
  const capR = sctx.measureText('H').actualBoundingBoxAscent / 100 || 0.73;
  const ink = s => { const m = sctx.measureText(s || ' '); return { w: Math.max(1, m.actualBoundingBoxLeft + m.actualBoundingBoxRight), l: m.actualBoundingBoxLeft }; };
  const t1 = T.line1.toUpperCase(), t2 = T.line2.toUpperCase();
  const portrait = H > W * 1.05;
  let textW = W * (portrait ? 0.86 : 0.8);
  const i1 = ink(t1), i2 = ink(t2);
  let f1 = 100 * textW / i1.w, f2 = 100 * textW / i2.w;
  let c1 = capR * f1, c2 = capR * f2;
  const gapK = 0.045;
  let total = c1 * (1 + gapK) + c2 * 1.42;
  const top0 = H * (portrait ? 0.2 : 0.17), avail = H * 0.92 - top0;
  if (total > avail) { const k = avail / total; f1 *= k; f2 *= k; c1 *= k; c2 *= k; textW *= k; total = avail; }
  const left = (W - textW) / 2;
  const topC = top0 + (avail - total) * (portrait ? 0.55 : 0.5);
  Object.assign(L, { capR, t1, t2, i1, i2, f1, f2, c1, c2, left, textW, topC, topU: topC + c1 * (1 + gapK) });
  L.capC = c1;
  L.gooBase = topC - 0.22 * c1;

  // keep the real text roughly where it's drawn (screen readers, find-in-page)
  const place = (el, x, capTop, size) => { Object.assign(el.style, { left: x + 'px', top: (capTop - size * 0.2) + 'px', fontSize: size + 'px' }); };
  place(textEls.line1, left, topC, f1);
  place(textEls.line2, left, L.topU, f2);
  const fL = Math.max(10, 0.11 * c2 / capR);
  const labTop = L.topU + c2 + 0.075 * c2;
  place(textEls.tag1, left, labTop, fL);
  place(textEls.tag2, W / 2 - 40, labTop, fL);
  place(textEls.tag3, left + textW - 60, labTop, fL);
}

function drawScene() {
  const w = Math.max(1, Math.round(W * rScale)), h = Math.max(1, Math.round(H * rScale));
  if (scene.width !== w || scene.height !== h) { scene.width = w; scene.height = h; }
  const c = sctx;
  c.setTransform(rScale, 0, 0, rScale, 0, 0);
  c.clearRect(0, 0, W, H);
  const { left, textW, topC, topU, c1, c2, f1, f2, i1, i2, capR } = L;
  const botU = topU + c2;

  // bar
  const by0 = topU + c2 * 0.72, by1 = botU + c2 * 0.4;
  const bg = c.createLinearGradient(0, by0, 0, by1);
  bg.addColorStop(0, '#090c1d'); bg.addColorStop(0.45, '#101850'); bg.addColorStop(1, '#2448ff');
  c.fillStyle = bg; c.fillRect(W * 0.03, by0, W * 0.94, by1 - by0);

  c.textBaseline = 'alphabetic'; c.textAlign = 'left';
  c.font = `${f1}px ${FONT}`;
  const g1 = c.createLinearGradient(0, topC, 0, topC + c1);
  g1.addColorStop(0, '#7392ec'); g1.addColorStop(0.55, '#3b5df7'); g1.addColorStop(1, '#2649ff');
  c.fillStyle = g1; c.fillText(L.t1, left + i1.l * f1 / 100, topC + c1);

  c.font = `${f2}px ${FONT}`;
  const g2 = c.createLinearGradient(0, topU, 0, botU);
  g2.addColorStop(0, '#f3f5f8'); g2.addColorStop(1, '#cbd6df');
  c.fillStyle = g2; c.fillText(L.t2, left + i2.l * f2 / 100, botU);

  const fL = Math.max(10, 0.11 * c2 / capR);

  st.addInput(P, 'snap', { label: 'snap distance %', min: 10, max: 150, step: 1 });

  const bu = pane.addFolder({ title: 'Burst' });
  bu.addInput(P, 'burstSize', { label: 'hole size', min: 0.04, max: 0.35, step: 0.01 });
  bu.addInput(P, 'burstForce', { label: 'force', min: 0, max: 3, step: 0.05 });
  const lk = pane.addFolder({ title: 'Look' });
  lk.addInput(P, 'refraction', { min: 0, max: 6, step: 0.05 });
  lk.addInput(P, 'rim', { label: 'rim thickness', min: 0.4, max: 2.5, step: 0.05 });
  lk.addInput(P, 'seeThrough', { label: 'see-through', min: 0, max: 1, step: 0.01 });
  lk.addInput(P, 'density', { label: 'glitter density', min: 0.2, max: 2, step: 0.05 });
  lk.addInput(P, 'brightness', { label: 'glitter bright', min: 0, max: 3, step: 0.05 });
  lk.addInput(P, 'twinkle', { min: 0, max: 1, step: 0.05 });
  lk.addInput(P, 'nebula', { min: 0, max: 2, step: 0.05 });
  const co = pane.addFolder({ title: 'Colour', expanded: false });
  [['cVoid', 'void'], ['cBody', 'body'], ['cDeep', 'deep body'], ['cRim', 'rim light'], ['cGlow', 'void glow'], ['cNeb', 'nebula'],
   ['cStar1', 'glitter white'], ['cStar2', 'glitter cyan'], ['cStar3', 'glitter violet'], ['cStar4', 'glitter blue']]
    .forEach(([k, label]) => co.addInput(P, k, { label }));
  const tx = pane.addFolder({ title: 'Type', expanded: false });
  tx.addInput(P, 'showType', { label: 'show type' });
  tx.addInput(T, 'line1', { label: 'line 1' });
  tx.addInput(T, 'line2', { label: 'line 2' });
  tx.addInput(T, 'tag1', { label: 'label left' });
  tx.addInput(T, 'tag2', { label: 'label mid' });
  tx.addInput(T, 'tag3', { label: 'label right' });
  const pf = pane.addFolder({ title: 'Performance', expanded: false });
  pf.addInput(P, 'maxDpr', { label: 'max pixel ratio', min: 0.5, max: 3, step: 0.25 });
  pane.addButton({ title: 'Pour it again' }).on('click', () => { holes.length = 0; drops.length = 0; S.on = false; S.attached = false; resetEdge(true); });
  const copyBtn = pane.addButton({ title: 'Copy settings' });
  copyBtn.on('click', () => {
    const text = JSON.stringify({ settings: P, type: T }, null, 2);
    const done = label => { copyBtn.title = label; setTimeout(() => { copyBtn.title = 'Copy settings'; }, 1600); };
    const fallback = () => {
      let box = document.getElementById('copyBox');
      if (!box) {
        box = document.createElement('textarea');
        box.id = 'copyBox'; box.readOnly = true; box.setAttribute('aria-label', 'Current settings');
        Object.assign(box.style, { position: 'fixed', right: '12px', bottom: '64px', width: 'min(320px, calc(100vw - 24px))', height: '220px', zIndex: 4,
          background: '#080a1a', color: '#dfe5ec', border: '1px solid rgba(140,160,255,.35)', borderRadius: '8px', padding: '10px', font: '11px/1.4 "IBM Plex Mono", ui-monospace, monospace' });
        box.addEventListener('blur', () => box.remove());
        document.body.appendChild(box);
      }
      box.value = text; box.focus(); box.select();
      done('Selected, press Cmd+C');
    };
    try {
      navigator.clipboard.writeText(text).then(() => done('Copied'), fallback);
    } catch (err) { fallback(); }
  });
  pane.on('change', onPaneChange);
}

/* ---------- boot ---------- */
refreshColors();
setupPane();
syncTypeBtn();
if (gl && prog) {
  resize();
  window.addEventListener('resize', resize);
  start();
  if (document.fonts) {
    document.fonts.load(`100px ${FONT}`).then(() => { layoutType(); drawScene(); }).catch(() => {});
    document.fonts.ready.then(() => { layoutType(); drawScene(); });
  }
} else {
  W = innerWidth; H = innerHeight; minD = Math.min(W, H);
  layoutType();
  ctlBtn.hidden = true;
}

})();
</script>
</body>
</html>
